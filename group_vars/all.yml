---
# ---------------------------------------------------------------------------
# Global variables for the Docker Swarm cluster
# ---------------------------------------------------------------------------

# Docker APT repo channel: "stable" (recommended), "test", or "nightly".
docker_apt_channel: stable

# Packages installed from the official Docker repository.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# The user that should be added to the 'docker' group (so it can run docker
# without sudo). Defaults to the SSH user set in the inventory.
docker_user: "{{ ansible_user }}"

# Docker 28+ defaults to the containerd image store (the "overlayfs"
# snapshotter), whose layer layout cAdvisor cannot read — per-container
# metrics come up empty. Disabling it reverts to the classic overlay2 store
# that cAdvisor understands. Leave true unless you have a reason not to.
docker_disable_containerd_snapshotter: true

# Registries Docker may pull from over plain HTTP or with an untrusted TLS
# cert (e.g. a local lab registry). Docker refuses these unless listed here.
# Each entry is "host:port". Leave empty to not configure any.
docker_insecure_registries:
  - 192.168.71.100:5000

# ---------------------------------------------------------------------------
# Swarm settings
# ---------------------------------------------------------------------------

# Inventory hostname of the node that initializes the swarm (the manager).
swarm_manager_host: swarm-mgr-1

# Address the manager advertises to the rest of the cluster.
# Uses the manager's inventory ansible_host so there is a single source of truth.
swarm_advertise_addr: "{{ hostvars[swarm_manager_host]['ansible_host'] }}"

# Port the manager listens on for cluster management (join address).
swarm_manager_port: 2377

# Open the required swarm ports with ufw. Set to false on a flat lab LAN
# where ufw is disabled (the default for a fresh Ubuntu Server install).
configure_ufw: false

# ---------------------------------------------------------------------------
# Monitoring stack (Prometheus + Grafana + Portainer)
# Deployed as a single Docker stack onto the swarm by the 'monitoring' role.
# ---------------------------------------------------------------------------

# Master switch for the whole monitoring play.
monitoring_enabled: true

# Directory on the manager where configs live and are bind-mounted from.
monitoring_dir: /opt/monitoring

# Published UI ports (reachable on the manager's IP).
grafana_port: 3000
prometheus_port: 9090        # Prometheus UI/Targets page exposed
portainer_port: 9443         # Portainer HTTPS UI

# Grafana admin login. Plaintext for this lab setup — change from the
# default and keep this file out of any public push.
grafana_admin_password: admin

# Prometheus on-disk retention.
prometheus_retention: 15d

# Alertmanager is intentionally left off for now; flip to add it later.
alertmanager_enabled: false

# Portainer (cluster/stack management UI + per-node agent).
portainer_enabled: true

# Memory budget for the agents on each node. cAdvisor is the autoscaler's only
# source of per-container metrics, so if it is OOM-killed the autoscaler goes
# blind and stops scaling — give it headroom rather than the tightest limit
# that happens to work on an idle cluster.
cadvisor_memory_limit: 512M
cadvisor_memory_reservation: 128M

# Grafana is bounded so it cannot crowd the manager-pinned database out of
# memory. Prometheus is intentionally left unbounded (a limit gets it killed
# mid-compaction); give the manager VM enough RAM instead.
grafana_memory_limit: 384M

# Pinned image tags for reproducible deploys.
prometheus_image: prom/prometheus:v2.54.1
grafana_image: grafana/grafana:11.2.0
node_exporter_image: prom/node-exporter:v1.8.2
cadvisor_image: gcr.io/cadvisor/cadvisor:v0.49.1
portainer_image: portainer/portainer-ce:2.21.4
portainer_agent_image: portainer/agent:2.21.4

# ---------------------------------------------------------------------------
# Autoscaler
# A manager-pinned service that polls Prometheus for per-service CPU/memory
# and adjusts replica counts via the Docker API. Deployed as its own stack by
# the 'autoscaler' role; it reuses the monitoring stack's Prometheus/cAdvisor.
# ---------------------------------------------------------------------------

# Master switch for the autoscaler play.
autoscaler_enabled: true

# Directory on the manager for the script, Dockerfile, rules, and compose file.
autoscaler_dir: /opt/autoscaler

# Local image repo name; the role appends a tag derived from the script hash.
autoscaler_image_repo: swarm-autoscaler

# How often (seconds) the autoscaler evaluates every service.
autoscaler_poll_interval: 10

# Averaging window for the CPU rate query. This is the autoscaler's reaction
# time: a 2m window spreads a 90s burst over two minutes, so a short load test
# peaks at roughly (burst / window) of the real CPU figure and never crosses
# cpu_high.
#
# 30s is two of Prometheus' 15s scrapes — the fewest rate() will accept, and
# deliberately at that floor so a demo reacts in ~40s instead of ~90s. The
# trade is noise: with two samples a single late or missed scrape visibly
# moves the figure, so expect the logged cpu% to jitter between polls. Use
# 60s (four samples) for anything where stability matters more than latency.
autoscaler_rate_window: 30s

# How the autoscaler reaches Prometheus. 'monitoring_prometheus' is the full
# Swarm service name, resolvable from any container on the monitoring network.
prometheus_query_url: "http://monitoring_prometheus:9090"

# Per-service scaling rules. Thresholds are percentages of the service's own
# CPU / memory limit, so they need deploy.resources.limits set on the target.
# Only todo_frontend is autoscaled; todo_backend and the stateful single-replica
# todo_db are deliberately NOT listed.
autoscale_services:
  - name: todo_frontend
    min: 2
    max: 6
    cpu_high: 80       # CPU% of limit -> scale up
    cpu_low: 25        # CPU% of limit -> eligible to scale down
    mem_high: 80       # MEM% of limit -> scale up
    mem_low: 30        # MEM% of limit -> eligible to scale down
    step_up: 2         # scale up in larger steps than down
    step_down: 1
    cooldown: 120      # seconds to wait after a scaling action

# ---------------------------------------------------------------------------
# Traefik edge + canary deployments
# A manager-pinned reverse proxy that becomes the cluster's only HTTP ingress.
# It discovers the frontend services through the Swarm provider and splits
# traffic between them with a weighted round-robin service declared in a file
# the 'traefik' role templates. See Todo-list/CANARY.md for the runbook.
# ---------------------------------------------------------------------------

# Master switch for the Traefik play.
traefik_enabled: true

# Directory on the manager for the stack file, dynamic config, and helpers.
traefik_dir: /opt/traefik

# Pinned image tag for reproducible deploys. v3.1+ is required: the Swarm
# provider ('--providers.swarm.*') is a separate provider from the Docker one
# only from that version on.
traefik_image: traefik:v3.7.16

# Published ports on the manager. 80 replaces the frontend's old 8080 publish
# as the app's entrypoint; 8081 avoids colliding with it during a transition.
traefik_http_port: 80
traefik_dashboard_port: 8081

# Prometheus metrics entrypoint. Deliberately NOT published: Traefik joins the
# monitoring overlay and is scraped there.
traefik_metrics_port: 8082

# Bounded like Grafana so the edge cannot crowd the manager-pinned database out
# of memory. Traefik's footprint is small and flat; this is generous headroom.
traefik_memory_limit: 256M
traefik_memory_reservation: 64M

# Standalone overlay network shared by the Traefik stack and both app stacks.
# Created by the role, referenced as 'external' everywhere else, so no compose
# file is coupled to a stack name.
traefik_public_network: traefik-public

# ---------------------------------------------------------------------------
# Canary routing
# ---------------------------------------------------------------------------

# Rule for the public router. Everything on the entrypoint goes to the weighted
# service; the per-version Host(...) routers declared in the app stacks' labels
# have a higher priority, so they still win for direct verification.
canary_router_rule: "PathPrefix(`/`)"

# Traefik service names declared by deploy.labels in the two app stacks. The
# file provider references them as "<name>@swarm".
canary_stable_service: todo-stable
canary_canary_service: todo-canary

# Split the playbook writes on every run. Keep the canary at 0 so a fresh
# deploy never routes to a canary stack that isn't there.
canary_initial_stable_weight: 100
canary_initial_canary_weight: 0

# Pin each visitor to one version with a cookie. OFF by default so the version
# flips visibly on reload, which is the point of the demo. Turn it ON for a
# realistic rollout: without it a browser can load index.html from one version
# and a hashed asset from the other. See the caveat in Todo-list/CANARY.md.
canary_sticky: false
