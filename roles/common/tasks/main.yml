---
# OS preparation common to all swarm nodes.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-pip
    state: present

# community.docker modules need the Python Docker SDK on the target.
- name: Install Docker SDK for Python
  ansible.builtin.pip:
    name: docker
    state: present

- name: Open required Docker Swarm ports (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "2377", proto: "tcp" }   # cluster management
    - { port: "7946", proto: "tcp" }   # node discovery
    - { port: "7946", proto: "udp" }   # node discovery
    - { port: "4789", proto: "udp" }   # overlay network traffic
  when: configure_ufw | bool
