# Docker Swarm cluster inventory
# Adjust ansible_user below if your VMs use a different sudo user.

[managers]
swarm-mgr-1 ansible_host=192.168.71.100

[workers]
swarm-wrk-1 ansible_host=192.168.71.101
swarm-wrk-2 ansible_host=192.168.71.102

# Parent group so 'common' and 'docker' roles apply to every node.
[swarm:children]
managers
workers

[swarm:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
